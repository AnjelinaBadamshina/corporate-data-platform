name: Corporate Data Platform CI

on:
  push:
    branches:
      - main
      - release-2.2
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get project source code
        uses: actions/checkout@v5

      - name: Get release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Show release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Release version is ${{ steps.version.outputs.VERSION }}"

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        id: owner
        run: echo "lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Обычная сборка (только для push в main, без тегов)
      - name: Build and publish Docker image
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/corporate-data-platform:${{ github.sha }}

      # Релизная сборка (только при пуше тега v*)
      - name: Build and publish release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/corporate-data-platform:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.owner.outputs.lc }}/corporate-data-platform:latest